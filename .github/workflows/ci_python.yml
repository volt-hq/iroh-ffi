name: CI Python

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  python:
    name: Python - Build and test
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.11"
      - name: Set up virtualenv
        run: |
          pip install virtualenv==20.35.4
          virtualenv venv
          source venv/bin/activate
          pip install setuptools==80.10.2 pytest==9.1.1 pytest-asyncio==1.4.0 "maturin[patchelf]==1.14.1" uniffi-bindgen==0.31.0
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
          echo "$PWD/venv/bin" >> $GITHUB_PATH
      - name: cargo make test-python
        run: cargo make test-python
