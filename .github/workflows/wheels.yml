name: Python Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  manylinux:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        name: [ubuntu-latest, ubuntu-arm-latest]
        include:
          - name: ubuntu-latest
            release-os: manylinux_2_28
            release-arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64:latest@sha256:2e78900cf94fe627b4be0d1f6ff709e8bd4527ca8768103c5fb8c77d40bf3750
            runner: [self-hosted, linux, X64]
          - name: ubuntu-arm-latest
            release-os: manylinux_2_28
            release-arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64:latest@sha256:f1e4f217b5c0bd9d0e9532314f09c3a8b88d945974901b844fd91c2902964993
            runner: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Install exact cargo-make
        uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - name: Install maturin & uniffi-bindgen
        run: /opt/python/cp311-cp311/bin/pip install maturin==1.14.1 uniffi-bindgen==0.31.0
      - name: cargo make python-wheel-manylinux
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/python/cp311-cp311/bin:$PATH
          cargo make python-wheel-manylinux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.release-os }}-${{ matrix.release-arch }}
          path: target/wheels/*.whl
          # Consumed by the `publish` job in the same run. 3 days leaves margin
          # to re-run a failed publish without holding ~3GB for 90 days.
          retention-days: 3

  osx:
    # arm64-only: the org has no GitHub-hosted macOS and x86_64 mac wheels
    # were dropped.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11.13"
      - run: pip install maturin==1.14.1 uniffi-bindgen==0.31.0
      - name: maturin build
        run: maturin build --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-darwin-aarch64
          path: target/wheels/*.whl
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11.13"
      - run: pip install maturin==1.14.1 uniffi-bindgen==0.31.0
      - name: cargo make python-wheel
        run: cargo make python-wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows-x86_64
          path: target/wheels/*.whl
          retention-days: 3

  publish:
    name: Publish wheels to PyPI
    needs: [manylinux, osx, windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, X64]
    # Trusted Publishing (OIDC) — no long-lived PyPI token needed. Requires
    # the publisher to be registered once at
    # https://pypi.org/manage/account/publishing/ (project: iroh,
    # owner: n0-computer, repo: iroh-ffi, workflow: wheels.yml).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          skip-existing: true
