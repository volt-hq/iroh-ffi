name: docs

on:
  workflow_dispatch:
  push:
    tags:
      - "upstream-v*"

# Allow one concurrent deployment; never cancel an in-progress Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  # Only Swift needs macOS + Xcode. It builds *only* the macOS-arm64
  # framework slice (not the 3 iOS slices DocC never consumes).
  swift:
    name: Swift docs (DocC)
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, xcode16]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - run: cargo make docs-swift
      # DocC emits selector filenames with ':' (e.g. onchange(addr:).json),
      # which the pinned upload-artifact action rejects as cross-platform-invalid.
      # Tar it so the artifact is a single safe-named file.
      - run: tar -czf docs-swift.tgz -C site swift
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-swift
          path: docs-swift.tgz
          if-no-files-found: error
          retention-days: 1

  python:
    name: Python docs (pdoc)
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.11"
      - name: Set up virtualenv (maturin builds the extension)
        run: |
          pip install virtualenv==20.35.4
          virtualenv venv
          source venv/bin/activate
          pip install setuptools==80.10.2 "maturin[patchelf]==1.14.1" uniffi-bindgen==0.31.0 pdoc==16.0.0
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
          echo "$PWD/venv/bin" >> $GITHUB_PATH
      - run: cargo make docs-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-python
          path: site/python
          if-no-files-found: error
          retention-days: 1

  js:
    name: JavaScript docs (TypeDoc)
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: "24.9.0"
      - run: cargo make docs-js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-js
          path: site/js
          if-no-files-found: error
          retention-days: 1

  kotlin:
    name: Kotlin docs (Dokka)
    timeout-minutes: 30
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - uses: davidB/rust-cargo-make@eb4338cc4e8145107109b722ee749f23e61455f0 # v1.12.0
        with:
          version: 0.37.24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17.0.16+8"
      - run: cargo make docs-kotlin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-kotlin
          path: site/kotlin
          if-no-files-found: error
          retention-days: 1

  landing:
    name: Landing page
    timeout-minutes: 10
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12.11"
      - run: pip install pyyaml==6.0.3
      - run: python3 scripts/docs/gen_landing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-landing
          path: site/index.html
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble + upload Pages artifact
    needs: [swift, python, js, kotlin, landing]
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-swift
          path: .
      - run: mkdir -p site && tar -xzf docs-swift.tgz -C site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-python
          path: site/python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-js
          path: site/js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-kotlin
          path: site/kotlin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-landing
          path: site
      - name: Sanity-check the assembled site
        run: |
          set -eu
          for p in site/index.html site/swift/index.html \
                   site/python/index.html site/js/index.html \
                   site/kotlin/index.html; do
            test -f "$p" || { echo "MISSING: $p" >&2; exit 1; }
          done
          echo "assembled site OK ($(find site -type f | wc -l) files)"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: assemble
    runs-on: [self-hosted, linux, X64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
